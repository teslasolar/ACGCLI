# 📐 KONOMI:ACG-TPL-004 | tokens:~120 | scope:go runtime template
# acg.yaml — Go project template
name: my-go-project
version: 0.1.0
description: "A Go project"
author: TODO
guild: acg

runtime:
  language: go
  entry: .

commands:
  run:
    cmd: "go run ."
    description: "Run the application"
  test:
    cmd: "go test ./..."
    description: "Run test suite"
  build:
    cmd: "go build ."
    description: "Build binary"
  lint:
    cmd: "golangci-lint run"
    description: "Lint"
  clean:
    cmd: "go clean"
    description: "Clean build artifacts"

health:
  - name: "Go version"
    check: "go version"
  - name: "Modules tidy"
    check: "go mod verify"

api:
  port: 9000
  cors: true

mcp:
  name: my-go-project-mcp

ai:
  provider: local
  model: phi3
  context_files:
    - README.md
    - acg.yaml
    - main.go
